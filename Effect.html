<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detektif Tajwid - Lam Jalalah & Ra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFFDF9;
    --gold: #E5B448;
    --gold-dark: #8C6615;
    --gold-soft: #FDF3DB;
    --green: #279663;
    --green-dark: #174E34;
    --green-soft: #E7F6ED;
    --red: #E74C3C;
    --ink: #22292F;
    --blue: #2E7BB0;
    --peach: #FFF0E8;
    --shadow-card: 0 16px 36px -8px rgba(39, 150, 99, 0.16), 0 6px 16px rgba(0, 0, 0, 0.04);
    --radius-lg: 24px;
    --radius-md: 16px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(135deg, #F3F8F2 0%, #E9F4EE 40%, #FAF6E8 100%);
    color: var(--ink);
    padding: 20px 14px 40px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .wrap {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
  }

  /* Animasi Transisi Halus Masuk */
  @keyframes cardAppear {
    from {
      opacity: 0;
      transform: translateY(18px) scale(0.98);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .card {
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(14px);
    border: 2px solid rgba(229, 180, 72, 0.4);
    border-radius: var(--radius-lg);
    padding: 26px 20px;
    margin-bottom: 18px;
    box-shadow: var(--shadow-card);
    position: relative;
    overflow: hidden;
    animation: cardAppear 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--gold), var(--green), var(--gold));
  }

  .mascot-hero {
    text-align: center;
    margin-bottom: 10px;
  }

  .mascot-hero img {
    width: 88px;
    height: 88px;
    animation: gentleBounce 2.5s ease-in-out infinite;
    filter: drop-shadow(0 8px 12px rgba(39, 150, 99, 0.2));
  }

  @keyframes gentleBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--green-dark);
    margin: 0 0 6px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .sub {
    text-align: center;
    font-size: 14px;
    color: #6C7A6F;
    margin-bottom: 22px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  label {
    display: block;
    font-family: 'Fredoka', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--green-dark);
  }

  input[type=text], select {
    width: 100%;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    border: 2px solid #E3EBE4;
    font-size: 15.5px;
    margin-bottom: 14px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    background: #FAFCF9;
    color: var(--ink);
    transition: all 0.25s ease;
  }

  input[type=text]:focus, select:focus {
    outline: none;
    border-color: var(--green);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(39, 150, 99, 0.15);
  }

  .btn {
    width: 100%;
    padding: 15px 18px;
    border: none;
    border-radius: var(--radius-md);
    font-size: 16.5px;
    font-weight: 700;
    font-family: 'Fredoka', sans-serif;
    letter-spacing: 0.3px;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(135deg, #2EA46F 0%, var(--green-dark) 100%);
    margin-top: 6px;
    box-shadow: 0 8px 18px rgba(39, 150, 99, 0.32);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(39, 150, 99, 0.38);
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn:disabled {
    background: #CBD5CD;
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }

  /* Progress Bar */
  .progress-wrap {
    background: #E8EFEA;
    border-radius: 30px;
    height: 12px;
    overflow: hidden;
    margin-bottom: 8px;
    padding: 2px;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--green));
    width: 0%;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 30px;
  }

  .progress-text {
    text-align: center;
    font-size: 13px;
    color: #6C7A6F;
    margin-bottom: 16px;
    font-weight: 700;
  }

  .q-title {
    font-family: 'Fredoka', sans-serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--green-dark);
    margin-bottom: 8px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .q-type-tag {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--gold-dark);
    background: var(--gold-soft);
    padding: 5px 14px;
    border-radius: 30px;
    margin: 0 auto 12px;
    text-align: center;
    letter-spacing: 0.3px;
  }

  .q-type-wrap { text-align: center; }

  .story-box {
    background: #FDFDFC;
    border: 2px dashed rgba(229, 180, 72, 0.6);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    font-size: 15.5px;
    line-height: 1.7;
    margin-bottom: 16px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
  }

  /* Font Arab Khusus yang Nyaman Dibaca */
  .arabic {
    font-family: 'Amiri', serif;
    font-size: 32px;
    direction: rtl;
    text-align: center;
    margin: 8px 0;
    color: var(--green-dark);
    font-weight: 700;
    line-height: 1.9;
  }

  /* Tombol Pilihan Soal */
  .opt-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: #FFFFFF;
    border: 2px solid #E6EEE7;
    border-radius: var(--radius-md);
    padding: 14px 16px;
    margin-bottom: 11px;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Quicksand', sans-serif;
    cursor: pointer;
    color: var(--ink);
    transition: all 0.2s ease;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
  }

  .opt-btn:hover:not(:disabled) {
    border-color: var(--green);
    background: #F8FCF9;
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(39, 150, 99, 0.12);
  }

  .opt-btn:active {
    transform: scale(0.98);
  }

  .opt-btn.correct {
    background: var(--green-soft) !important;
    border-color: var(--green) !important;
    color: var(--green-dark) !important;
    font-weight: 800;
    animation: correctPulse 0.4s ease;
  }

  .opt-btn.wrong {
    background: #FEECEB !important;
    border-color: var(--red) !important;
    color: var(--red) !important;
    animation: shake 0.35s ease;
  }

  .opt-btn.selected {
    background: var(--green-soft);
    border-color: var(--green);
    font-weight: 700;
  }

  .opt-btn:disabled {
    cursor: default;
  }

  @keyframes correctPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .warn-msg {
    text-align: center;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--red);
    min-height: 20px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  table.match-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    margin-bottom: 12px;
  }

  table.match-table td {
    padding: 10px 6px;
    border-bottom: 1px solid #EBF0EC;
    vertical-align: middle;
  }

  table.match-table select {
    margin-bottom: 0;
    padding: 10px 10px;
    font-size: 13.5px;
  }

  .feedback {
    text-align: center;
    font-family: 'Fredoka', sans-serif;
    font-size: 15px;
    font-weight: 600;
    min-height: 26px;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.25s ease;
  }

  .feedback.ok { color: var(--green); }
  .feedback.no { color: var(--red); }

  .result-emoji {
    text-align: center;
    margin-bottom: 8px;
  }

  .result-emoji img {
    width: 80px;
    height: 80px;
    animation: gentleBounce 2s ease-in-out infinite;
  }

  .result-score {
    text-align: center;
    font-family: 'Fredoka', sans-serif;
    font-size: 54px;
    font-weight: 700;
    color: var(--green-dark);
    margin: 4px 0;
  }

  .result-label {
    text-align: center;
    font-size: 15px;
    color: #6C7A6F;
    margin-bottom: 10px;
    font-weight: 700;
  }

  .status {
    text-align: center;
    font-size: 13.5px;
    margin-top: 12px;
    min-height: 20px;
    font-weight: 700;
  }

  .status.ok { color: var(--green); }
  .status.err { color: var(--red); }

  .empty-note {
    text-align: center;
    font-size: 13px;
    color: #6C7A6F;
    padding: 8px 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-weight: 600;
    line-height: 1.5;
  }

  .footer-note {
    text-align: center;
    font-size: 13px;
    color: #7B8B7E;
    padding: 6px 12px 18px;
    line-height: 1.6;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
    font-weight: 600;
  }

  .path-step {
    font-size: 14.5px;
    color: var(--green-dark);
    text-align: center;
    margin-bottom: 10px;
    font-weight: 700;
    font-family: 'Fredoka', sans-serif;
  }

  .hidden { display: none !important; }

  /* ============================================================
     🌄 LAYAR PEMANDANGAN GUNUNG NYATA (Estetik & Cinematic)
     ============================================================ */
  .scene-box {
    position: relative;
    border-radius: var(--radius-md);
    overflow: hidden;
    margin-bottom: 18px;
    height: 190px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
  }

  .scene-bg-real {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    animation: zoomKenBurns 18s ease-in-out infinite alternate;
  }

  @keyframes zoomKenBurns {
    from { transform: scale(1); }
    to { transform: scale(1.12); }
  }

  .scene-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(18, 56, 38, 0.65) 100%);
  }

  .scene-mascot {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    animation: gentleBounce 1.8s ease-in-out infinite;
  }

  .scene-mascot img {
    width: 54px;
    height: 54px;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.4));
  }

  .scene-caption {
    text-align: center;
    font-family: 'Fredoka', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--green-dark);
    margin-bottom: 16px;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- LAYAR NAMA -->
  <div class="card" id="screenName">
    <div class="mascot-hero"><img src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/72x72/1f575.png" alt="detektif"></div>
    <h1>Detektif Tajwid</h1>
    <div class="sub">Lam Jalalah &middot; Idhar Syafawi &middot; Ra Tarqiq &amp; Tafkhim</div>
    <label for="namaInput">Nama Detektif Cilik</label>
    <input type="text" id="namaInput" placeholder="Tulis nama lengkapmu...">
    <button class="btn" id="startBtn">Mulai Petualangan <img src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/72x72/1f680.png" alt="roket" style="width:22px;height:22px;"></button>
  </div>

  <!-- LAYAR KUIS -->
  <div class="card hidden" id="screenQuiz">
    <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
    <div class="progress-text" id="progressText">Soal 1 dari 10</div>
    <div class="q-type-wrap"><span class="q-type-tag" id="qType">Pilihan Ganda</span></div>
    <div class="q-title" id="qTitle"></div>
    <div id="qBody"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <!-- LAYAR PEMANDANGAN GUNUNG NYATA -->
  <div class="card hidden" id="screenScene">
    <div class="scene-box">
      <!-- Pemandangan foto alam pegunungan asli beresolusi tinggi -->
      <img class="scene-bg-real" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1000&q=80" alt="Pemandangan Pegunungan Asli">
      <div class="scene-overlay"></div>
      <div class="scene-mascot"><img src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/72x72/1f575.png" alt="detektif berjalan"></div>

    <div class="progress-wrap"><div class="progress-bar" id="sceneBar"></div></div>
    <div class="scene-caption" id="sceneCaption">Pos 1 dari 10</div>

  <!-- LAYAR HASIL -->
  <div class="card hidden" id="screenResult">
    <div class="result-emoji" id="resultEmoji"></div>
    <div class="result-score" id="resultScore">0</div>
    <div class="result-label">Nilai Akhir Petualangan</div>
    <div class="sub" id="resultDetail"></div>
    <div class="status" id="submitStatus"></div>
  </div>

  <div class="card" id="infoNote">
    <div class="empty-note">
      <img src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/72x72/1f4ca.png" alt="grafik" style="width:22px;height:22px;">
      Rekap nilai otomatis tersimpan ke catatan ustad/ustadzah. Kerjakan dengan teliti ya!
    </div>
  </div>

  <div class="footer-note">
    Semoga bertambah ilmu dan berkah belajarnya! <img src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/72x72/263a.png" alt="senyum" style="width:18px;height:18px;">
  </div>
</div>

<script>

// ================== BANK SOAL ==================

const SCORED_TOTAL = 10;
let currentQ = 0;
let score = 0;
let answers = [];
let studentName = "";

const screenName = document.getElementById('screenName');
const screenQuiz = document.getElementById('screenQuiz');
const screenScene = document.getElementById('screenScene');
const screenResult = document.getElementById('screenResult');
const qBody = document.getElementById('qBody');
const feedback = document.getElementById('feedback');

document.getElementById('startBtn').addEventListener('click', () => {
  const nama = document.getElementById('namaInput').value.trim();
  if (nama.length < 2) {
    document.getElementById('namaInput').style.borderColor = 'var(--red)';
    document.getElementById('namaInput').focus();
    return;
  }
  studentName = nama;
  screenName.classList.add('hidden');
  showScene(0);
});

function showScene(nextIndex) {
  screenQuiz.classList.add('hidden');
  screenScene.classList.remove('hidden');
  const total = questions.length;
  const persen = Math.round((Math.min(nextIndex, total) / total) * 100);
  document.getElementById('sceneBar').style.width = persen + '%';

  const captionEl = document.getElementById('sceneCaption');
  const continueBtn = document.getElementById('sceneContinueBtn');

  if (nextIndex >= total) {
    captionEl.textContent = 'Alhamdulillah, kamu sampai di puncak petualangan!';
    continueBtn.innerHTML = 'Lihat Hasil Akhir ' + stiker('1f3c1', 22, 'selesai');
  } else {
    captionEl.textContent = 'Pos Perjalanan ' + (nextIndex + 1) + ' dari ' + total;
    continueBtn.innerHTML = 'Lanjutkan Petualangan ' + stiker('1f9ed', 22, 'lanjut');
  }

  continueBtn.onclick = () => {
    screenScene.classList.add('hidden');
    if (nextIndex >= total) {
      finishQuiz();
    } else {
      currentQ = nextIndex;
      screenQuiz.classList.remove('hidden');
      loadQuestion();
    }
  };
}

function updateProgress() {
  document.getElementById('progressText').textContent = 'Soal ' + (currentQ + 1) + ' dari ' + questions.length;
  document.getElementById('bar').style.width = Math.round((currentQ / questions.length) * 100) + '%';
}

function goNext(isCorrect, msg) {
  answers.push(isCorrect);
  if (isCorrect) score++;
  const icon = isCorrect ? stiker('2705', 20, 'benar') : stiker('274c', 20, 'salah');
  feedback.innerHTML = icon + ' ' + msg;
  feedback.className = 'feedback ' + (isCorrect ? 'ok' : 'no');
  setTimeout(() => {
    showScene(currentQ + 1);
  }, 1100);
}

function loadQuestion() {
  const q = questions[currentQ];
  updateProgress();
  feedback.innerHTML = '';
  feedback.className = 'feedback';
  document.getElementById('qType').textContent = q.tag;
  document.getElementById('qTitle').innerHTML = stiker(q.icon, 24, q.title) + '<span>' + q.title + '</span>';
  qBody.innerHTML = '';

  const storyBox = document.createElement('div');
  storyBox.className = 'story-box';
  storyBox.innerHTML = q.story;
  qBody.appendChild(storyBox);

  if (q.type === 'mc') renderMC(q);
  else if (q.type === 'match') renderMatch(q);
  else if (q.type === 'tf') renderTF(q);
  else if (q.type === 'multi') renderMulti(q);
  else if (q.type === 'table') renderTable(q);
  else if (q.type === 'path') renderPath(q);
}

// ---------- Pilihan Ganda ----------
function renderMC(q) {
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.onclick = () => {
      Array.from(qBody.querySelectorAll('.opt-btn')).forEach(b => b.disabled = true);
      const isCorrect = idx === q.correct;
      btn.classList.add(isCorrect ? 'correct' : 'wrong');
      if (!isCorrect) qBody.querySelectorAll('.opt-btn')[q.correct].classList.add('correct');
      goNext(isCorrect, isCorrect ? 'Masya Allah, Tepat sekali!' : 'Belum pas, perhatikan jawaban hijau ya');
    };
    qBody.appendChild(btn);
  });
}

// ---------- Cocokkan Pasangan ----------
function renderMatch(q) {
  const table = document.createElement('table');
  table.className = 'match-table';
  q.pairs.forEach((pair, idx) => {
    const tr = document.createElement('tr');
    const tdLeft = document.createElement('td');
    tdLeft.textContent = pair.left;
    tdLeft.style.fontWeight = '600';
    const tdRight = document.createElement('td');
    const sel = document.createElement('select');
    sel.dataset.idx = idx;
    const optDefault = document.createElement('option');
    optDefault.textContent = '-- pilih jawaban --';
    optDefault.value = '';
    sel.appendChild(optDefault);
    q.options.forEach(opt => {
      const o = document.createElement('option');
      o.textContent = opt;
      o.value = opt;
      sel.appendChild(o);
    });
    tdRight.appendChild(sel);
    tr.appendChild(tdLeft);
    tr.appendChild(tdRight);
    table.appendChild(tr);
  });
  qBody.appendChild(table);

  const warnEl = document.createElement('div');
  warnEl.className = 'warn-msg';
  qBody.appendChild(warnEl);
  table.querySelectorAll('select').forEach(sel => { sel.onchange = () => { warnEl.innerHTML = ''; }; });

  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.textContent = 'Cocokkan Jawaban';
  btn.onclick = () => {
    const selects = table.querySelectorAll('select');
    const belumLengkap = Array.from(selects).some(sel => sel.value === '');
    if (belumLengkap) {
      warnEl.innerHTML = stiker('26a0', 16, 'peringatan') + ' Pasangkan semua dulu ya sebelum diperiksa!';
      return;
    }
    let allCorrect = true;
    selects.forEach((sel, idx) => {
      if (sel.value !== q.pairs[idx].correct) allCorrect = false;
      sel.disabled = true;
    });
    btn.disabled = true;
    goNext(allCorrect, allCorrect ? 'Keren, semua pasangannya cocok!' : 'Masih ada yang tertukar, tetap semangat!');
  };
  qBody.appendChild(btn);
}

// ---------- Benar / Salah ----------
function renderTF(q) {
  const btnTrue = document.createElement('button');
  btnTrue.className = 'opt-btn';
  btnTrue.innerHTML = stiker('2705', 20, 'benar') + '<span>Benar</span>';
  const btnFalse = document.createElement('button');
  btnFalse.className = 'opt-btn';
  btnFalse.innerHTML = stiker('274c', 20, 'salah') + '<span>Salah</span>';

  function handle(choice) {
    btnTrue.disabled = true;
    btnFalse.disabled = true;
    const isCorrect = choice === q.correct;
    (choice ? btnTrue : btnFalse).classList.add(isCorrect ? 'correct' : 'wrong');
    if (!isCorrect) (q.correct ? btnTrue : btnFalse).classList.add('correct');
    goNext(isCorrect, isCorrect ? 'Benar sekali!' : 'Belum tepat, cermati lagi definisinya ya');
  }
  btnTrue.onclick = () => handle(true);
  btnFalse.onclick = () => handle(false);
  qBody.appendChild(btnTrue);
  qBody.appendChild(btnFalse);
}

// ---------- Pilih Jawaban Benar (multi-select) ----------
function renderMulti(q) {
  const selected = new Set();
  const buttons = [];

  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.onclick = () => {
      if (selected.has(idx)) {
        selected.delete(idx);
        btn.classList.remove('selected');
      } else {
        selected.add(idx);
        btn.classList.add('selected');
      }
      warnEl.innerHTML = '';
    };
    buttons.push(btn);
    qBody.appendChild(btn);
  });

  const warnEl = document.createElement('div');
  warnEl.className = 'warn-msg';
  qBody.appendChild(warnEl);

  const checkBtn = document.createElement('button');
  checkBtn.className = 'btn';
  checkBtn.textContent = 'Periksa Jawaban';
  checkBtn.onclick = () => {
    if (selected.size === 0) {
      warnEl.innerHTML = stiker('26a0', 16, 'peringatan') + ' Ketuk pilihanmu dulu ya!';
      return;
    }
    buttons.forEach(b => b.disabled = true);
    checkBtn.disabled = true;
    const selectedArr = Array.from(selected).sort();
    const correctArr = [...q.correctIndexes].sort();
    const isCorrect = JSON.stringify(selectedArr) === JSON.stringify(correctArr);
    buttons.forEach((b, idx) => {
      if (q.correctIndexes.includes(idx)) b.classList.add('correct');
      else if (selected.has(idx)) b.classList.add('wrong');
    });
    goNext(isCorrect, isCorrect ? 'Hebat, kamu berhasil memilih jawaban benar!' : 'Belum semua tepat, cek jawaban berwarna hijau');
  };
  qBody.appendChild(checkBtn);
}

// ---------- Isi Tabel ----------
function renderTable(q) {
  const table = document.createElement('table');
  table.className = 'match-table';
  q.rows.forEach((row, idx) => {
    const tr1 = document.createElement('tr');
    const tdAr = document.createElement('td');
    tdAr.colSpan = 2;
    tdAr.innerHTML = '<div class="arabic">' + row.arabic + '</div>';
    tr1.appendChild(tdAr);
    table.appendChild(tr1);

    const tr2 = document.createElement('tr');
    const tdHukum = document.createElement('td');
    const selHukum = document.createElement('select');
    selHukum.dataset.idx = idx;
    selHukum.dataset.field = 'hukum';
    const opt0 = document.createElement('option'); opt0.textContent = '-- hukum bacaan --'; opt0.value=''; selHukum.appendChild(opt0);
    q.hukumOptions.forEach(o => { const el = document.createElement('option'); el.textContent = o; el.value = o; selHukum.appendChild(el); });
    tdHukum.appendChild(selHukum);

    const tdTipe = document.createElement('td');
    const selTipe = document.createElement('select');
    selTipe.dataset.idx = idx;
    selTipe.dataset.field = 'tipe';
    const optT0 = document.createElement('option'); optT0.textContent = '-- tipis/tebal --'; optT0.value=''; selTipe.appendChild(optT0);
    q.tipeOptions.forEach(o => { const el = document.createElement('option'); el.textContent = o; el.value = o; selTipe.appendChild(el); });
    tdTipe.appendChild(selTipe);

    tr2.appendChild(tdHukum);
    tr2.appendChild(tdTipe);
    table.appendChild(tr2);
  });
  qBody.appendChild(table);

  const warnEl = document.createElement('div');
  warnEl.className = 'warn-msg';
  qBody.appendChild(warnEl);
  table.querySelectorAll('select').forEach(sel => { sel.onchange = () => { warnEl.innerHTML = ''; }; });

  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.textContent = 'Periksa Tabel';
  btn.onclick = () => {
    const selects = table.querySelectorAll('select');
    const belumLengkap = Array.from(selects).some(sel => sel.value === '');
    if (belumLengkap) {
      warnEl.innerHTML = stiker('26a0', 16, 'peringatan') + ' Pilih semua pilihan pada tabel ya!';
      return;
    }
    let allCorrect = true;
    q.rows.forEach((row, idx) => {
      const selHukum = table.querySelector('select[data-field="hukum"][data-idx="' + idx + '"]');
      const selTipe = table.querySelector('select[data-field="tipe"][data-idx="' + idx + '"]');
      if (selHukum.value !== row.hukum || selTipe.value !== row.tipe) allCorrect = false;
      selHukum.disabled = true;
      selTipe.disabled = true;
    });
    btn.disabled = true;
    goNext(allCorrect, allCorrect ? 'Analisis tabelmu sempurna!' : 'Ada yang belum sesuai dengan kaidah harakat');
  };
  qBody.appendChild(btn);
}

// ---------- Mini Game Jalur ----------
function renderPath(q) {
  let stepIdx = 0;
  let pathCorrect = true;

  function renderStep() {
    qBody.querySelectorAll('.path-dynamic').forEach(el => el.remove());
    if (stepIdx >= q.steps.length) {
      goNext(pathCorrect, pathCorrect ? 'Hebat, kamu menuntaskan jalur musafir dengan benar!' : 'Ada langkah yang kurang tepat di perjalanan');
      return;
    }
    const step = q.steps[stepIdx];
    const label = document.createElement('div');
    label.className = 'path-step path-dynamic';
    label.textContent = 'Langkah ' + (stepIdx + 1) + ': ' + step.q;
    qBody.appendChild(label);

    step.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn path-dynamic';
      btn.textContent = opt;
      btn.onclick = () => {
        if (idx !== step.correct) pathCorrect = false;
        stepIdx++;
        renderStep();
      };
      qBody.appendChild(btn);
    });
  }
  renderStep();
}

// ================== KIRIM HASIL KE SPREADSHEET ==================
async function finishQuiz() {
  document.getElementById('bar').style.width = '100%';
  screenQuiz.classList.add('hidden');
  screenResult.classList.remove('hidden');

  const nilai = Math.round((score / SCORED_TOTAL) * 100);
  const tier = nilai >= 90 ? { code: '1f3c6', alt: 'juara' }
             : nilai >= 70 ? { code: '1f389', alt: 'senang' }
             : nilai >= 50 ? { code: '1f44d', alt: 'lumayan' }
             : { code: '1f4aa', alt: 'semangat' };
  document.getElementById('resultEmoji').innerHTML = stiker(tier.code, 76, tier.alt).replace('vertical-align:middle;', '');
  document.getElementById('resultScore').textContent = nilai;
  document.getElementById('resultDetail').textContent = 'Benar ' + score + ' dari ' + SCORED_TOTAL + ' soal • Ananda ' + studentName;

  const statusEl = document.getElementById('submitStatus');
  statusEl.textContent = 'Menyimpan nilai ke buku guru...';
  statusEl.className = 'status';

  const record = {
    nama: studentName,
    skor: score,
    total: SCORED_TOTAL,
    nilai: nilai,
    waktu: new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
  };

  try {
    await fetch(SHEET_WEBAPP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(record)
    });
    statusEl.innerHTML = stiker('2705', 18, 'terkirim') + ' Nilai berhasil dikirim ke guru!';
    statusEl.className = 'status ok';
  } catch (e) {
    statusEl.innerHTML = stiker('274c', 18, 'gagal') + ' Koneksi terputus saat kirim nilai. Pastikan internet lancar ya.';
    statusEl.className = 'status err';
  }
}
