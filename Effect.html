
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detektif Tajwid</title>
    <style>
        /* ==================== 1. PENGATURAN DASAR & BACKGROUND ==================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #1a0826, #4a154b); /* Langit malam detektif */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1000px;
        }

        /* ==================== 2. HIASAN GUNUNG & ROKET BERGERAK (CUSTOMIZABLE) ==================== */
        /* Lapisan Gunung Belakang (Bergerak Lambat) */
        .gunung-back {
            position: absolute;
            bottom: -20px;
            left: -10%;
            width: 120%;
            height: 300px;
            background: #230c33;
            clip-path: polygon(0% 100%, 20% 40%, 45% 65%, 75% 30%, 100% 100%);
            z-index: 1;
            animation: gunungGoyang 12s ease-in-out infinite alternate;
        }

        /* Lapisan Gunung Depan (Bergerak Lebih Cepat) */
        .gunung-front {
            position: absolute;
            bottom: -10px;
            left: -5%;
            width: 110%;
            height: 200px;
            background: #36134f;
            clip-path: polygon(0% 100%, 15% 50%, 35% 70%, 60% 45%, 80% 65%, 100% 100%);
            z-index: 2;
            animation: gunungGoyang 8s ease-in-out infinite alternate-reverse;
        }

        /* Roket Detektif Tajwid */
        .roket-dekorasi {
            position: absolute;
            top: 15%;
            right: 15%;
            font-size: 4rem;
            z-index: 1;
            filter: drop-shadow(0 0 20px rgba(255, 165, 0, 0.6));
            animation: roketMelayang 4s ease-in-out infinite alternate;
        }

        /* Bintang-bintang berkedip */
        .bintang {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: kedip 2s infinite ease-in-out;
        }

        /* ==================== 3. WADAH UTAMA KUIS (SMOOTH SLIDER) ==================== */
        .kuis-card-box {
            position: relative;
            width: 90%;
            max-width: 480px;
            height: 450px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            border: 4px solid #ffd700; /* Bingkai emas detektif */
            z-index: 10;
            overflow: hidden;
        }

        /* Gaya dasar untuk setiap lembar soal */
        .slide-soal {
            position: absolute;
            width: 100%;
            height: 100%;
            padding: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            
            /* KONDISI AWAL: Disembunyikan di bawah & samar-samar */
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            pointer-events: none;
            
            /* KUNCI UTAMA TRANSISI: Dibuat super smooth mengalir ke atas */
            transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), 
                        transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* KONDISI AKTIF: Meluncur naik dan muncul dengan mulus */
        .slide-soal.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        /* Elemen teks didalam slide */
        .judul-soal {
            font-size: 1.4rem;
            color: #4a154b;
            margin-bottom: 5px;
            font-weight: 800;
        }

        .sub-judul {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 25px;
        }

        /* Tombol Pilihan Jawaban */
        .opsi-jawaban {
            width: 100%;
            padding: 14px 20px;
            margin: 8px 0;
            background: white;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .opsi-jawaban:hover {
            border-color: #ffd700;
            background: #fffdf0;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.2);
        }

        /* ==================== 4. TIMELINE ANIMASI (KEYFRAMES) ==================== */
        @keyframes gunungGoyang {
            0% { transform: translateX(-2%) translateY(0); }
            100% { transform: translateX(2%) translateY(5px); }
        }

        @keyframes roketMelayang {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
            100% { transform: translateY(5px) rotate(-2deg); }
        }

        @keyframes kedip {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Elemen Dekorasi Latar Belakang -->
    <div class="bintang" style="top:10%; left:20%; width:3px; height:3px; animation-delay: 0.5s;"></div>
    <div class="bintang" style="top:30%; left:70%; width:4px; height:4px; animation-delay: 1s;"></div>
    <div class="bintang" style="top:50%; left:10%; width:2px; height:2px; animation-delay: 1.5s;"></div>
    <div class="roket-dekorasi">🚀</div>
    <div class="gunung-back"></div>
    <div class="gunung-front"></div>

    <!-- Wadah Aplikasi Kuis -->
    <div class="kuis-card-box">
        
        <!-- Soal 1 -->
        <div class="slide-soal active" id="soal1">
            <div class="judul-soal">🕵️‍♂️ Detektif Tajwid</div>
            <div class="sub-judul">Soal 1 dari 10 • Lam Jalalah</div>
            <p style="margin-bottom: 20px; font-weight: 600;">Bagaimana cara membaca Lam Jalalah jika didahului harakat Fathah?</p>
            
            <button class="opsi-jawaban" onclick="pindahKeSoal(1, 2)">A. Dibaca Tebal (Tafkhim)</button>
            <button class="opsi-jawaban" onclick="pindahKeSoal(1, 2)">B. Dibaca Tipis (Tarqiq)</button>
        </div>

        <!-- Soal 2 -->
        <div class="slide-soal" id="soal2">
            <div class="judul-soal">🕵️‍♂️ Detektif Tajwid</div>
            <div class="sub-judul">Soal 2 dari 10 • Hukum Ra</div>
            <p style="margin-bottom: 20px; font-weight: 600;">Ketika huruf Ra berharakat Kasrah, maka hukum bacaannya adalah...</p>
            
            <button class="opsi-jawaban" onclick="pindahKeSoal(2, 1)">A. Ra Tafkhim</button>
            <button class="opsi-jawaban" onclick="pindahKeSoal(2, 1)">B. Ra Tarqiq</button>
        </div>

    </div>

    <!-- ==================== 5. LOGIKA JAVASCRIPT ==================== */ -->
    <script>
        function pindahKeSoal(nomorSekarang, nomorTujuan) {
            const slideSekarang = document.getElementById(`soal${nomorSekarang}`);
            const slideTujuan = document.getElementById(`soal${nomorTujuan}`);

            if (slideSekarang && slideTujuan) {
                // Sembunyikan slide lama (otomatis meluncur halus karena efek CSS transition)
                slideSekarang.classList.remove('active');
                
                // Beri jeda sepersekian detik agar animasi keluar selesai, baru masukkan slide baru
                setTimeout(() => {
                    slideTujuan.classList.add('active');
                }, 150); 
            }
        }
    </script>
</body>
</html>
