<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detektif Tajwid - Adventure Mode</title>
    <style>
        /* ==================== 1. RESET & BACKGROUND MANAGEMENT ==================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom, #11031c, #2d0b3d, #52135a); 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* ==================== 2. DEKORASI PARALAKS GUNUNG & ROKET ==================== */
        .gunung-jauh {
            position: absolute;
            bottom: -30px;
            left: -10%;
            width: 120%;
            height: 280px;
            background: #190624;
            clip-path: polygon(0% 100%, 25% 35%, 50% 60%, 75% 25%, 100% 100%);
            z-index: 1;
            animation: gunungGoyang 15s ease-in-out infinite alternate;
        }

        .gunung-dekat {
            position: absolute;
            bottom: -15px;
            left: -5%;
            width: 110%;
            height: 180px;
            background: #280a3a;
            clip-path: polygon(0% 100%, 15% 45%, 40% 65%, 65% 40%, 85% 60%, 100% 100%);
            z-index: 2;
            animation: gunungGoyang 10s ease-in-out infinite alternate-reverse;
        }

        .roket-dekorasi {
            position: absolute;
            top: 12%;
            right: 12%;
            font-size: 4.5rem;
            z-index: 1;
            filter: drop-shadow(0 0 25px rgba(255, 140, 0, 0.7));
            animation: roketMelayang 4s ease-in-out infinite alternate;
        }

        /* ==================== 3. GAME CONTAINER (BINGKAI UTAMA) ==================== */
        .game-wrapper {
            position: relative;
            width: 90%;
            max-width: 520px;
            height: 380px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            border: 5px solid #ffcc00; /* Bingkai Emas Khas Detektif */
            z-index: 10;
            overflow: hidden;
        }

        /* ==================== 4. SMOOTH SLIDER LOGIC (HORIZONTAL FLUID) ==================== */
        .slide-container {
            display: flex;
            width: 200%; /* Jumlah slide (2) x 100% */
            height: 100%;
            /* KUNCI SMOOTH: Pergerakan super mulus kesamping */
            transition: transform 0.65s cubic-bezier(0.25, 1, 0.5, 1); 
        }

        .slide-soal {
            width: 50%; /* Mengisi setengah dari lebar container (1 slide utuh) */
            height: 100%;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* ==================== 5. ELEMEN LATIHAN & HURUF ==================== */
        .judul-game {
            font-size: 1.6rem;
            color: #3d0c41;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .info-soal {
            font-size: 0.95rem;
            color: #ff9900;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .teks-soal {
            font-size: 1.15rem;
            color: #222;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 25px;
            max-width: 90%;
        }

        /* Grid Opsi Jawaban (Biar Ga Kaku Memanjang) */
        .grid-jawaban {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Membagi jadi 2 kolom sejajar */
            gap: 15px;
            width: 100%;
            max-width: 440px;
        }

        .tombol-opsi {
            padding: 15px 20px;
            background: #f8f9fa;
            border: 3px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: bold;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Efek pop-up membal */
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* Efek interaktif pas disentuh mouse */
        .tombol-opsi:hover {
            border-color: #ffcc00;
            background: #fffdf0;
            color: #3d0c41;
            transform: scale(1.04) translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 204, 0, 0.25);
        }

        /* Tombol navigasi balik */
        .tombol-kembali {
            grid-column: span 2; /* Memenuhi baris bawah */
            background: #edf2f7;
            border: 2px dashed #cbd5e0;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tombol-kembali:hover { background: #e2e8f0; }

        /* ==================== 6. KEYFRAMES ANIMASI LATAR ==================== */
        @keyframes gunungGoyang {
            0% { transform: translateX(-1%) translateY(0); }
            100% { transform: translateX(1%) translateY(8px); }
        }

        @keyframes roketMelayang {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(4deg); }
            100% { transform: translateY(8px) rotate(-3deg); }
        }
    </style>
</head>
<body>

    <!-- Elemen Dekorasi Bergerak -->
    <div class="roket-dekorasi">🚀</div>
    <div class="gunung-jauh"></div>
    <div class="gunung-dekat"></div>

    <!-- Wadah Aplikasi Kuis -->
    <div class="game-wrapper">
        <div class="slide-container" id="sliderEngine">
            
            <!-- SLIDE SOAL 1 -->
            <div class="slide-soal">
                <div class="judul-game">🕵️‍♂️ Detektif Tajwid</div>
                <div class="info-soal">Soal 1 dari 10 • Lam Jalalah</div>
                <div class="teks-soal">Bagaimana cara membaca Lam Jalalah jika didahului harakat Fathah?</div>
                
                <div class="grid-jawaban">
                    <button class="tombol-opsi" onclick="geserSlide(1)">A. Dibaca Tebal (Tafkhim)</button>
                    <button class="tombol-opsi" onclick="geserSlide(1)">B. Dibaca Tipis (Tarqiq)</button>
                </div>
            </div>

            <!-- SLIDE SOAL 2 -->
            <div class="slide-soal">
                <div class="judul-game">🕵️‍♂️ Detektif Tajwid</div>
                <div class="info-soal">Soal 2 dari 10 • Hukum Ra</div>
                <div class="teks-soal">Ketika huruf Ra berharakat Kasrah, maka hukum bacaannya adalah...</div>
                
                <div class="grid-jawaban">
                    <button class="tombol-opsi" onclick="geserSlide(0)">A. Ra Tafkhim</button>
                    <button class="tombol-opsi" onclick="geserSlide(0)">B. Ra Tarqiq</button>
                    <button class="tombol-kembali" onclick="geserSlide(0)">⬅ Kembali ke Soal Sebelumnya</button>
                </div>
            </div>

        </div>
    </div>

    <!-- ==================== 7. JAVASCRIPT ENGINE ==================== -->
    <script>
        function geserSlide(indeksTujuan) {
            const engine = document.getElementById('sliderEngine');
            // Menggeser container utama berdasarkan persentase indeks slide (0% atau -50%)
            engine.style.transform = `translateX(-${indeksTujuan * 50}%)`;
        }
    </script>
</body>
</html>
